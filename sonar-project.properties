# =============================================================================
# SonarQube Configuration for Animal Shelter Microservices
# =============================================================================

# Project Identification
sonar.projectKey=animal-shelter-microservices
sonar.projectName=Animal Shelter Microservices
sonar.projectVersion=1.0.0

# Source and Test Directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.libraries=target/dependency/*.jar

# Coverage Reports (Jacoco)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.jacoco.reportPaths=target/site/jacoco/jacoco.xml

# Test Reports
sonar.junit.reportPaths=target/surefire-reports

# Exclusions (Files to ignore)
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/.git/**,\
  **/build/**,\
  **/dist/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/generated/**,\
  **/META-INF/**,\
  **/application*.yml,\
  **/application*.properties,\
  **/logback*.xml,\
  **/swagger-ui/**,\
  **/static/**

# Test Exclusions
sonar.test.exclusions=\
  **/target/**,\
  **/test-classes/**,\
  **/generated-test-sources/**

# Duplication Exclusions
sonar.cpd.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/model/**,\
  **/config/**

# Quality Gate Configuration
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8

# Language Specific Settings
sonar.java.source=21
sonar.java.target=21

# Security Hotspots
sonar.security.hotspots.includeAll=true

# Code Smells and Bugs
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore specific patterns
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1118
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java

sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.java

sonar.issue.ignore.multicriteria.e4.ruleKey=java:S1854
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.java

sonar.issue.ignore.multicriteria.e5.ruleKey=java:S1481
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.java
