  #     - name: Set up JDK ${{ env.JAVA_VERSION }}
  #       uses: actions/setup-java@v4
  #       with:
  #         java-version: ${{ env.JAVA_VERSION }}
  #         distribution: 'temurin'

  #     - name: Cache Maven dependencies
