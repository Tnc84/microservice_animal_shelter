name: Microservices CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  MAVEN_OPTS: -Xmx1024m
  JAVA_VERSION: '17'
  MYSQL_VERSION: '8.0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Stage 1: Code Quality and Security
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests with coverage
        run: |
          mvn clean test jacoco:report

      - name: Run SonarQube analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.java.source=21 \
            -Dsonar.java.target=21

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=ALL \
            -Dformat=HTML \
            -Dformat=JSON

      - name: Upload dependency check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-results
          path: target/dependency-check-report.*

  # Stage 2: Build Parent POM and Common Module
  build-parent-and-common:
    name: Build Parent POM and Common Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM
        run: |
          mvn clean install -N -DskipTests

      - name: Build common module
        run: |
          cd animal-shelter-common
          mvn clean install -DskipTests

  # Stage 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build-parent-and-common]
    strategy:
      matrix:
        service: [api-gateway-as, micro_as_animal, micro_as_shelter, micro_as_user, naming-server-as]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM (for dependencies)
        run: |
          mvn clean install -N -DskipTests

      - name: Build common module (for dependencies)
        run: |
          cd animal-shelter-common
          mvn clean install -DskipTests

      - name: Run unit tests for ${{ matrix.service }}
        run: |
          cd ${{ matrix.service }}
          mvn clean test \
            -Dspring.profiles.active=test \
            -Dmaven.test.failure.ignore=false

      - name: Generate test report
        run: |
          cd ${{ matrix.service }}
          mvn surefire-report:report

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/

  # Stage 4: Integration Tests
