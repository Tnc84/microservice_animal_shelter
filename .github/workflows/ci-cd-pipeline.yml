  #         restore-keys: ${{ runner.os }}-m2

  #     - name: Install parent POM (for dependencies)
  #       run: |
  #         mvn clean install -N -DskipTests

  #     - name: Build common module (for dependencies)
  #       run: |
  #         cd animal-shelter-common
  #         mvn clean install -DskipTests

  #     - name: Run performance tests
  #       run: |
  #         mvn clean test \
  #           -Pperformance-tests \
  #           -Dspring.profiles.active=test

  #     - name: Upload performance test results
  #       uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: performance-test-results
  #         path: "*/target/surefire-reports/"

  # Stage 7: Build and Package
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, contract-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build all microservices
        run: |
          mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: "*/target/*.jar"

  # Stage 8: Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM and common module
        run: |
          mvn clean install -N -DskipTests
          cd animal-shelter-common
          mvn clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-gateway-as/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-api-gateway:latest
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-api-gateway:${{ github.sha }}

      - name: Build and push Animal Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./micro_as_animal/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-animal-service:latest
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-animal-service:${{ github.sha }}

      - name: Build and push Shelter Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./micro_as_shelter/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-shelter-service:latest
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-shelter-service:${{ github.sha }}

      - name: Build and push User Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./micro_as_user/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-user-service:latest
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-user-service:${{ github.sha }}

      - name: Build and push Naming Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./naming-server-as/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-naming-server:latest
            ${{ secrets.DOCKER_USERNAME }}/animal-shelter-naming-server:${{ github.sha }}

  # Stage 9: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # Example: docker-compose -f docker-compose.staging.yml up -d

  # Stage 10: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/
          # Example: docker-compose -f docker-compose.prod.yml up -d

  # Stage 11: End-to-End Tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install parent POM (for dependencies)
        run: |
          mvn clean install -N -DskipTests

      - name: Build common module (for dependencies)
        run: |
          cd animal-shelter-common
          mvn clean install -DskipTests

      - name: Run end-to-end tests
        run: |
          mvn clean test \
            -Pe2e-tests \
            -Dspring.profiles.active=staging

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: "*/target/surefire-reports/"

  # Stage 12: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Stage 13: Notification
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests,  contract-tests, build, docker-build]
    if: always()
    steps:
      - name: Notify on success
        if: ${{ needs.code-quality.result == 'success' && needs.unit-tests.result == 'success' }}
        run: |
          echo "✅ All tests passed! Pipeline successful."

      - name: Notify on failure
        if: ${{ needs.code-quality.result == 'failure' || needs.unit-tests.result == 'failure'  }}
        run: |
          echo "❌ Pipeline failed. Check the logs for details."
