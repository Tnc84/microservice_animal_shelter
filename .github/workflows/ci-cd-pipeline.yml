  #       with:
  #         path: ~/.m2
  #         key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
  #         restore-keys: ${{ runner.os }}-m2

  #     - name: Install parent POM (for dependencies)
  #       run: |
  #         mvn clean install -N -DskipTests

  #     - name: Build common module (for dependencies)
  #       run: |
  #         cd animal-shelter-common
  #         mvn clean install -DskipTests

  #     - name: Run integration tests
  #       run: |
  #         mvn clean verify \
  #           -Pintegration-tests \
  #           -Dspring.profiles.active=test \
  #           -Dspring.datasource.url=jdbc:mysql://localhost:3306/test_animal_shelter \
  #           -Dspring.datasource.username=root \
  #           -Dspring.datasource.password=rootpassword

  #     - name: Upload integration test results
  #       uses: actions/upload-artifact@v4
        # if: always()
  #       with:
  #         name: integration-test-results
  #         path: "*/target/surefire-reports/"

  # Stage 5: Contract Tests
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: [build-parent-and-common]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install parent POM (for dependencies)
        run: |
          mvn clean install -N -DskipTests

      - name: Build common module (for dependencies)
        run: |
          cd animal-shelter-common
          mvn clean install -DskipTests

      - name: Run contract tests
        run: |
          mvn clean test \
            -Pcontract-tests \
            -Dspring.profiles.active=test

      - name: Upload contract test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: "*/target/surefire-reports/"

  # Stage 6: Performance Tests
