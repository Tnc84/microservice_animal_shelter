server:
  port: 8093
spring:
  application:
    name: animal-microservice
#  cloud:
#    gcp:
#      project-id: animal-shelter-351809
#      credentials:
#        location: animal-shelter-351809-479e56280414.json
      #          classpath: D:\MyProject\Website projects\Projects\animal_shelter_microservices\animals\src\main\resources\animal-shelter-351809-479e56280414.json
#      sql:
#        database-name: animals-db
#        instance-connection-name: animal-shelter-351809:us-central1:animal-db
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/animal
    username: root
    password: root
#    initialization-mode: always
  profile:
    active: mysql
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    connection-timeout: 15000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  config:
    import: optional:configserver:http://localhost:8888
  # Micrometer Tracing Configuration (Spring Boot 3)
  zipkin:
    base-url: http://localhost:9411
    enabled: true
  sleuth:
    sampler:
      probability: 1.0  # 1.0 = 100% sampling (use 0.1 for production)
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      database:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      rabbitmq:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        sliding-window-size: 20
        minimum-number-of-calls: 10
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      rabbitmq:
        max-attempts: 5
        wait-duration: 1s
        exponential-backoff-multiplier: 1.5
  timelimiter:
    instances:
      database:
        timeout-duration: 5s
      rabbitmq:
        timeout-duration: 10s
  bulkhead:
    instances:
      database:
        max-concurrent-calls: 10
        max-wait-duration: 1s
      rabbitmq:
        max-concurrent-calls: 5
        max-wait-duration: 2s

# JWT Configuration - Internal tokens only
jwt:
  internal:
    secret: ${INTERNAL_JWT_SECRET:internalSecretKey}
    expiration: 600000  # 10 minutes

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,httptrace,circuitbreakers,retries,timelimiters,bulkheads
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% sampling rate (use 0.1 for production)