server:
  port: ${SERVER_PORT:8096}
spring:
  application:
    name: pet-hotel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost/pet-hotel
#    url: jdbc:mysql://${DB_HOST:localhost}/${DB_NAME:pet-hotel}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    #  ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: /
    connection-timeout: 15000
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

# JWT Configuration - Internal tokens only
jwt:
  internal:
    secret: ${INTERNAL_JWT_SECRET:internalSecretKey}
    expiration: 600000  # 10 minutes

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      database:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      rabbitmq:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        sliding-window-size: 20
        minimum-number-of-calls: 10
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
      rabbitmq:
        max-attempts: 5
        wait-duration: 1s
        exponential-backoff-multiplier: 1.5
  timelimiter:
    instances:
      database:
        timeout-duration: 5s
      rabbitmq:
        timeout-duration: 10s
  bulkhead:
    instances:
      database:
        max-concurrent-calls: 10
        max-wait-duration: 1s
      rabbitmq:
        max-concurrent-calls: 5
        max-wait-duration: 2s

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,httptrace,circuitbreakers,retries,timelimiters,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true