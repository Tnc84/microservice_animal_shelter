version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: animal_shelter_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: animal_shelter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup-databases.sql:/docker-entrypoint-initdb.d/setup-databases.sql
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: animal_shelter_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 20s
      retries: 10

  # Zipkin Distributed Tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Naming Server
  naming-server:
    build: ./naming-server-as
    container_name: naming-server
    ports:
      - "8761:8761"
    networks:
      - animal_shelter
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # API Gateway
  api-gateway:
    build: ./api-gateway-as
    container_name: api-gateway
    ports:
      - "8765:8765"
    networks:
      - animal_shelter
    depends_on:
      - naming-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  # Animal Microservice
  animal-microservice:
    build: ./micro_as_animal
    container_name: animal-microservice
    ports:
      - "8093:8093"
    networks:
      - animal_shelter
    depends_on:
      - naming-server
      - mysql
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/animal
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123

  # Shelter Microservice
  shelter-microservice:
    build: ./micro_as_shelter
    container_name: shelter-microservice
    ports:
      - "8092:8092"
    networks:
      - animal_shelter
    depends_on:
      - naming-server
      - animal-microservice
      - mysql
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/shelter
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123

  # User Management Microservice
  user-microservice:
    build: ./micro_as_user
    container_name: user-microservice
    ports:
      - "8091:8091"
    networks:
      - animal_shelter
    depends_on:
      - naming-server
      - mysql
      - rabbitmq
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_management
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=admin
      - SPRING_RABBITMQ_PASSWORD=admin123

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  animal_shelter:
    driver: bridge