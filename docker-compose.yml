services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DEFAULT_DATABASE}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup-databases.sql:/docker-entrypoint-initdb.d/setup-databases.sql
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ${RABBITMQ_CONTAINER_NAME}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_AMQP_PORT}:${RABBITMQ_AMQP_PORT}"
      - "${RABBITMQ_MANAGEMENT_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ${ZIPKIN_CONTAINER_NAME}
    ports:
      - "${ZIPKIN_HOST_PORT}:${ZIPKIN_CONTAINER_PORT}"
    networks:
      - animal_shelter
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${ZIPKIN_CONTAINER_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  naming-server:
    build:
      context: .
      dockerfile: ./naming-server-as/Dockerfile
    container_name: ${NAMING_SERVER_CONTAINER_NAME}
    ports:
      - "${NAMING_SERVER_HOST_PORT}:${NAMING_SERVER_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway-as/Dockerfile
    container_name: ${API_GATEWAY_CONTAINER_NAME}
    ports:
      - "${API_GATEWAY_HOST_PORT}:${API_GATEWAY_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      naming-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

  animal-microservice:
    build:
      context: .
      dockerfile: ./micro_as_animal/Dockerfile
    container_name: ${ANIMAL_SERVICE_CONTAINER_NAME}
    ports:
      - "${ANIMAL_SERVICE_HOST_PORT}:${ANIMAL_SERVICE_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_CONTAINER_PORT}/${ANIMAL_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

  shelter-microservice:
    build:
      context: .
      dockerfile: ./micro_as_shelter/Dockerfile
    container_name: ${SHELTER_SERVICE_CONTAINER_NAME}
    ports:
      - "${SHELTER_SERVICE_HOST_PORT}:${SHELTER_SERVICE_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      naming-server:
        condition: service_healthy
      animal-microservice:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_CONTAINER_PORT}/${SHELTER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

  user-microservice:
    build:
      context: .
      dockerfile: ./micro_as_user/Dockerfile
    container_name: ${USER_SERVICE_CONTAINER_NAME}
    ports:
      - "${USER_SERVICE_HOST_PORT}:${USER_SERVICE_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_CONTAINER_PORT}/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

  pet-hotel-microservice:
    build:
      context: .
      dockerfile: ./pet-hotel-microservice/Dockerfile
    container_name: ${PET_HOTEL_SERVICE_CONTAINER_NAME}
    ports:
      - "${PET_HOTEL_SERVICE_HOST_PORT}:${PET_HOTEL_SERVICE_CONTAINER_PORT}"
    networks:
      - animal_shelter
    depends_on:
      naming-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_CONTAINER_PORT}/${PET_HOTEL_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  animal_shelter:
    driver: bridge